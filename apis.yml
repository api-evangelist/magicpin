aid: magicpin
name: Magicpin
description: >-
  Magicpin (operated by Samast Technologies Private Limited) is India's hyperlocal
  savings and discovery platform, connecting consumers with deals, cashback, and
  vouchers across restaurants, food delivery, fashion, grocery, beauty, fitness,
  and electronics merchants in cities throughout India. The company operates a
  consumer savings app alongside a merchant/brands portal and corporate voucher
  solutions. As of this enrichment pass Magicpin publishes a consumer web and
  mobile experience plus partner and brand onboarding portals, but exposes no
  public developer API, OpenAPI specification, SDK, or developer documentation.
